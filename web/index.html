<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Otago</title>
    <script>
      (() => {
        var p = null;
        try { p = localStorage.getItem('otago.theme'); } catch {}
        var ok = p === 'standard' || p === 'dark' || p === 'cool';
        var dark = !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = ok ? p : dark ? 'dark' : 'standard';
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='3' fill='%232c4f7c'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' font-weight='700' fill='white' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
